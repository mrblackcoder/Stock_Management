# Test Profile
spring.profiles.active=test

# Test Database Configuration - H2 In-Memory by default.
# The driver and Hibernate dialect are intentionally NOT pinned so they are detected
# from the active JDBC URL: H2 locally, MySQL when CI overrides SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable security for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT Configuration for tests
jwt.secret=test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=3600000
jwt.refresh.expiration=604800000

# Admin defaults for tests
admin.default.password=TestAdmin123!

# Disable actuator for tests
management.endpoints.enabled-by-default=false
